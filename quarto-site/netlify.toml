[build]
  command = "wget -qO quarto.deb https://github.com/quarto-dev/quarto-cli/releases/download/v1.4.557/quarto-1.4.557-linux-amd64.deb && dpkg -x quarto.deb quarto-install && export PATH=$PATH:$(pwd)/quarto-install/usr/lib/quarto/bin && quarto render"
  publish = "_site"

[build.environment]
  QUARTO_VERSION = "1.4.557"
